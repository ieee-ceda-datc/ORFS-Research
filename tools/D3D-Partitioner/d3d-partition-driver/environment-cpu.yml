name: taiwei-d3d-cpu
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - cmake=3.26
  - gcc_linux-64=11
  - gxx_linux-64=11
  - bison>=3.8,<4
  - flex>=2.6
  - boost-cpp=1.81
  - zlib=1.2
  - numpy=1.26
  - scipy=1.15
  - pyyaml=6.0
  - matplotlib=3.9
  - cairo
  - cairocffi
  - colorama
  - pkg-config
  - setuptools
  - shapely
  - pytorch=2.5.1
  - torch-optimizer=0.3.0
  - cpuonly
  - pip
  - pip:
      - ncg_optimizer==0.2.2
